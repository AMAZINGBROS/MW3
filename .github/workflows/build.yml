name: Build DLL

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Project
      run: msbuild proxy_d3d9/proxy_d3d9.vcxproj /p:Configuration=Release /p:Platform=Win32
      
    - name: Find and Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: d3d9-dll
        path: releases/d3d9.dll
